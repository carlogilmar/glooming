[package]
name = "lgtm"
version = "0.1.0"
description = "lgtm — read code deeply"
authors = ["Carlo Padilla"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (a Windows
# issue: rust-lang/cargo#8519).
name = "lgtm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
] }
tokio = { version = "1", features = ["sync"] }
thiserror = "2"
dirs = "6"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "macros"] }

# Parsing. Elixir first; more grammars slot in beside it.
tree-sitter = "0.25"
tree-sitter-elixir = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
